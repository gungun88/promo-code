services:
  promo-code-postgres:
    image: postgres:16-alpine
    container_name: promo-code-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-promo_code}
      POSTGRES_USER: ${POSTGRES_USER:-promo_code}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - promo-code-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  promo-code-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: promo-code-backend
    restart: unless-stopped
    env_file:
      - ${PROMO_CODE_ENV_FILE:-.env.production}
    depends_on:
      promo-code-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18518:8000"
    volumes:
      - promo-code-backend-data:/app/backend/.data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  promo-code-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: promo-code-frontend
    restart: unless-stopped
    depends_on:
      promo-code-backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18517:80"

volumes:
  promo-code-postgres-data:
  promo-code-backend-data:
